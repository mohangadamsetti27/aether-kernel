[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-kernel"
version = "0.1.0"
description = "A lightweight runtime kernel and circuit breaker for autonomous AI agents"
authors = [{ name = "Mohan Ramesh" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0"
]

[tool.setuptools]
py-modules = ["kernel", "locks"]
